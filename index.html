marcou ao todo?","answers":["7","6","8","12"]},{"prompt":"Uma equipe venceu por 4 a 1. Qual foi a diferença de gols entre as equipes nessa partida?","answers":["3","2","4","5"]},{"prompt":"Em um campeonato no qual cada vitória vale 3 pontos, quantos pontos um time ganha com 4 vitórias?","answers":["12","7","9","16"]},{"prompt":"Qual destas duplas de cores é tradicionalmente associada ao Flamengo?","answers":["Vermelho e preto","Verde e branco","Azul e branco","Preto e amarelo"]},{"prompt":"Em qual país nasceu Pelé?","answers":["Brasil","Argentina","Portugal","Uruguai"]},{"prompt":"Qual seleção venceu a Copa do Mundo masculina de 2002?","answers":["Brasil","Alemanha","França","Argentina"]},{"prompt":"Qual cidade brasileira abriga o estádio do Maracanã?","answers":["Rio de Janeiro","São Paulo","Salvador","Belo Horizonte"]},{"prompt":"Um jogador marcou 2 gols em cada uma de 3 partidas. Quantos gols marcou nessas partidas?","answers":["6","5","8","9"]}],"seconds":30,"mathType":"mixed"}</script>
<script>
'use strict';
const $=id=>document.getElementById(id), embedded=JSON.parse($('payload').textContent), originalHTML='<!doctype html>\n'+document.documentElement.outerHTML;
let config=null, parsed=null, player=null, session=null, ticker=null, selected=null, currentResult=null;
const norm=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR');
function parseTXT(text){const blocks=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim().split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()));if(!blocks[0]||blocks[0].length!==1||!blocks[0][0])throw Error('O título deve ocupar uma linha, separado por uma linha vazia das questões.');const title=blocks.shift()[0];if(title.length>100)throw Error('Use um título de até 100 caracteres.');let names=[],questions=[],seen=new Set(),warnings=[];blocks.forEach((b,i)=>{if(b.length!==6||b.some(x=>!x))throw Error('Bloco '+(i+1)+': esperado apelido, pergunta e 4 respostas (6 linhas). Encontradas '+b.length+'.');const [name,prompt,...answers]=b;if(name.length>40||prompt.length>700||answers.some(x=>x.length>250))throw Error('Bloco '+(i+1)+': limite de 40 caracteres no apelido, 700 na pergunta e 250 por alternativa.');if(new Set(answers.map(norm)).size!==4)throw Error('Bloco '+(i+1)+': há alternativas repetidas.');if(seen.has(norm(prompt)))throw Error('Bloco '+(i+1)+': pergunta repetida.');seen.add(norm(prompt));if(names.some(n=>norm(n)===norm(name)))warnings.push('Apelido repetido: '+name+' (aparecerá uma vez).');else names.push(name);questions.push({prompt,answers});});if(questions.length<9)throw Error('São necessárias pelo menos 9 questões. Encontradas: '+questions.length+'.');if(questions.length>500)throw Error('Use até 500 questões por jogo.');return {title,names,questions,warnings};}
function shuffle(xs){const a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const int=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function mathQuestion(mode='mixed'){let kind=mode==='mixed'?shuffle(['mul','div','add','sub','two'])[0]:mode;let a,b,c,prompt,value;if(kind==='mul'){a=int(2,10);b=int(2,10);prompt=a+' × '+b;value=a*b;}else if(kind==='div'){b=int(2,10);value=int(2,12);a=b*value;prompt=a+' ÷ '+b;}else if(kind==='add'){a=int(10,50);b=int(5,50);prompt=a+' + '+b;value=a+b;}else if(kind==='sub'){a=int(20,100);b=int(1,a);prompt=a+' − '+b;value=a-b;}else{b=int(2,10);a=int(2,10);c=int(1,9);if(Math.random()<.5){prompt=(a*b)+' ÷ '+b+' + '+c;value=a+c;}else{prompt=a+' × '+b+' − '+c;value=a*b-c;if(value<0){prompt=a+' × '+b+' + '+c;value=a*b+c;}}}let vals=new Set([value]);while(vals.size<4){let v=value+int(-10,10);if(v>=0)vals.add(v);}return {prompt:'Calcule: '+prompt,answers:[...vals].map(String)};}
function makeRound(c,count=10){count=Math.max(1,Math.min(10,Math.floor(Number(count)||10),c.questions.length+1));return shuffle([...shuffle(c.questions).slice(0,count-1),mathQuestion(c.mathType)]).map(q=>({prompt:q.prompt,options:shuffle(q.answers.map((text,i)=>({text,correct:i===0})))}));}
function pointsFor(ms,seconds){return 1000+Math.floor(500*Math.max(0,1-ms/(seconds*1000)));}
function normalizeQRLink(value){let text=value.trim();if(!text)throw Error('Cole um link para gerar o QR code.');if(!/^https?:\/\//i.test(text)){if(/^[a-z][a-z0-9+.-]*:/i.test(text)&&!/^localhost:\d/i.test(text))throw Error('Use um link http ou https.');text='https://'+text;}let url;try{url=new URL(text);}catch{throw Error('Confira o endereço informado.');}if(!['http:','https:'].includes(url.protocol)||!url.hostname||url.username||url.password||/\s/.test(url.hostname))throw Error('Use um link http ou https válido.');if(url.href.length>2000)throw Error('Use um link com até 2.000 caracteres.');return url.href;}
function buildQR(value){const link=normalizeQRLink(value),qr=qrcode(0,'M');qr.addData(link,'Byte');qr.make();return {link,qr};}
function generateQR(){const status=$('qrStatus');$('qrOutput').hidden=true;$('qrDownload').disabled=true;try{const {link,qr}=buildQR($('qrLink').value);const n=qr.getModuleCount(),scale=Math.max(4,Math.ceil(800/(n+8))),size=(n+8)*scale,canvas=$('qrCanvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+4)*scale,(r+4)*scale,scale,scale);$('qrLink').value=link;$('qrTarget').textContent=link;$('qrTarget').href=link;$('qrOutput').hidden=false;$('qrDownload').disabled=false;status.textContent='';}catch(e){status.textContent=e instanceof Error?e.message:'Não foi possível gerar. Use um link mais curto.';}}

function download(name,text,type='text/plain;charset=utf-8'){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function addText(parent,tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e;}
function validate(){parsed=null;$('export').disabled=$('preview').disabled=true;$('review').replaceChildren();try{parsed=parseTXT($('source').value);$('status').className='notice';$('status').textContent=parsed.questions.length+' questões · '+parsed.names.length+' apelidos\n'+parsed.title+(parsed.warnings.length?'\n'+parsed.warnings.join('\n'):'');parsed.questions.forEach((q,i)=>{const d=addText($('review'),'div','','reviewItem');addText(d,'strong',(i+1)+'. '+q.prompt);q.answers.forEach((a,j)=>addText(d,'div',(j===0?'✓ ':'• ')+a,j===0?'correctText':'muted'));});$('export').disabled=$('preview').disabled=false;return true;}catch(e){$('status').className='notice error';$('status').textContent=e.message;return false;}}
function getConfig(){return {...onlineSettings(),title:parsed.title,names:parsed.names,questions:parsed.questions,seconds:Number($('seconds').value),mathType:$('mathType').value};}
function exportHTML(c){const doc=new DOMParser().parseFromString(originalHTML,'text/html');doc.getElementById('editor').remove();doc.getElementById('qrEngine').remove();doc.getElementById('appsCode').remove();doc.getElementById('backEditor').remove();doc.getElementById('payload').textContent=JSON.stringify(c).replace(/</g,'\\u003c');doc.title=c.title;doc.getElementById('brandText').textContent=c.title;return '<!doctype html>\n'+doc.documentElement.outerHTML;}
function key(){let s=JSON.stringify(config),h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return 'quiz-v3-'+(h>>>0);}
function ranks(){try{let r=JSON.parse(localStorage.getItem(key())||'[]');return Array.isArray(r)?r.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.points)&&Number.isFinite(x.time)&&Number.isFinite(x.hits)):[];}catch{return [];}}
const compare=(a,b)=>b.points-a.points||b.hits-a.hits||a.time-b.time;
let rankVersion=0, onlineRows=[], inFlight=new Map(), pendingMemory=new Map();
function online(c=config){return !!(c&&c.endpoint&&c.gameId);}
function onlineSettings(){const endpoint=$('endpoint').value.trim(),gameId=$('gameId').value.trim();if(!endpoint&&!gameId)return {};if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint))throw Error('Cole o endereço do Apps Script terminado em /exec.');if(!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(gameId))throw Error('Use um código de jogo com até 64 letras minúsculas, números, hífen ou sublinhado.');return {endpoint,gameId};}
function readRemote(c,params){return new Promise((resolve,reject)=>{
 const cb='quiz_cb_'+crypto.randomUUID().replace(/-/g,'_'),script=document.createElement('script');let timer;
 const cleanup=()=>{clearTimeout(timer);script.remove();delete window[cb];};
 window[cb]=data=>{cleanup();if(data&&data.ok)resolve(data);else reject(Error(data?.error||'Resposta inválida do ranking.'));};
 script.onerror=()=>{cleanup();reject(Error('Não foi possível acessar o ranking.'));};
 timer=setTimeout(()=>{cleanup();reject(Error('O ranking demorou a responder.'));},20000);
 const u=new URL(c.endpoint);Object.entries({...params,game:c.gameId||'',callback:cb,_:Date.now()}).forEach(([k,v])=>u.searchParams.set(k,v));script.src=u.href;document.head.append(script);
 });}
function pendingKey(c){return 'quiz-pending-v1:'+c.endpoint+':'+c.gameId;}
function pending(c){let k=pendingKey(c);if(pendingMemory.has(k))return pendingMemory.get(k);let rows=[];try{let raw=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(raw))rows=raw.filter(r=>r&&typeof r.id==='string'&&r.game===c.gameId);}catch{}pendingMemory.set(k,rows);return rows;}
function persistPending(c,rows){pendingMemory.set(pendingKey(c),rows);try{localStorage.setItem(pendingKey(c),JSON.stringify(rows));return true;}catch{return false;}}
function queueResult(c,r){let rows=pending(c).filter(x=>x.id!==r.id);rows.push(r);return persistPending(c,rows);}
function removePending(c,id){persistPending(c,pending(c).filter(x=>x.id!==id));}
function updatePendingButton(){const visible=online()&&pending(config).length>0;$('retryPending').hidden=!visible;}
async function sendResult(c,r){
 const k=pendingKey(c)+r.id;if(inFlight.has(k))return inFlight.get(k);
 const task=(async()=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{await fetch(c.endpoint,{method:'POST',mode:'no-cors',credentials:'omit',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(r),signal:controller.signal,redirect:'follow'});}catch{}finally{clearTimeout(timer);}
  // An opaque POST response is NOT confirmation. Read a server receipt before reporting success.
  for(let i=0;i<3;i++){
   if(i)await new Promise(resolve=>setTimeout(resolve,1500*i));
   const receipt=await readRemote(c,{action:'status',id:r.id});
   if(receipt.confirmed){removePending(c,r.id);return receipt;}
  }
  throw Error('Envio ainda não confirmado.');
 })();inFlight.set(k,task);try{return await task;}finally{inFlight.delete(k);}
}
async function submitCurrent(c,r){
 const active=()=>currentResult&&currentResult.id===r.id&&config===c;
 if(active()){$('storageNote').textContent='Enviando resultado…';$('retryResult').hidden=true;}
 try{const receipt=await sendResult(c,r);if(active()){currentResult.confirmed=true;$('storageNote').textContent=receipt.outcome==='record'?'Novo recorde salvo!':'Resultado recebido. Seu recorde foi mantido.';}}
 catch{if(active()){$('storageNote').textContent='Envio pendente. Tente novamente.';$('retryResult').hidden=false;}}
 finally{if(config===c)updatePendingButton();}
}
function drawRank(rows){let box=$('rank');box.replaceChildren();const r=rows.slice().sort(compare).slice(0,10);if(!r.length){addText(box,'p','Nenhum resultado.','muted');return;}const t=addText(box,'table','');const head=addText(t,'tr','');['#','Apelido','Pontos','Tempo'].forEach(x=>addText(head,'th',x));r.forEach((x,i)=>{let tr=addText(t,'tr','');[i+1,x.name,x.points,(x.time/1000).toFixed(1)+' s'].forEach(v=>addText(tr,'td',v));});}
async function renderRank(){const version=++rankVersion,c=config;updatePendingButton();if(!online(c)){drawRank(ranks());return;}const box=$('rank');box.replaceChildren();addText(box,'p','Carregando…','muted');$('refreshRank').disabled=true;try{const data=await readRemote(c,{action:'list'});if(version!==rankVersion||config!==c)return;if(!Array.isArray(data.rows))throw Error();onlineRows=data.rows;drawRank(onlineRows);}catch{if(version===rankVersion&&config===c){box.replaceChildren();addText(box,'p','Ranking indisponível. Tente atualizar.','muted');}}finally{if(version===rankVersion)$('refreshRank').disabled=false;}}
async function retryAll(){if(!online())return;const c=config;$('retryPending').disabled=true;for(const r of pending(c).slice()){try{await sendResult(c,r);if(currentResult?.id===r.id){currentResult.confirmed=true;$('retryResult').hidden=true;$('storageNote').textContent='Resultado recebido.';}}catch{break;}}if(config===c){$('retryPending').disabled=false;updatePendingButton();renderRank();}}

function screen(id){['home','play','result'].forEach(x=>$(x).hidden=x!==id);}
function loadGame(c){config=c;document.title=c.title;$('brandText').textContent=c.title;if($('editor'))$('editor').hidden=true;$('game').hidden=false;$('gameTitle').textContent=c.title;selected=null;$('start').disabled=true;$('players').replaceChildren();c.names.forEach(name=>{let b=addText($('players'),'button',name);b.onclick=()=>{selected=name;[...$('players').children].forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});$('start').disabled=false;};b.setAttribute('aria-pressed','false');});screen('home');renderRank();window.scrollTo(0,0);}
function start(guest=false){$('retryResult').hidden=true;player=guest?null:selected;if(!guest&&!player)return;session={round:makeRound(config,Number($('count').value)),index:0,points:0,hits:0,time:0,log:[],locked:false};screen('play');showQuestion();}
function showQuestion(){clearInterval(ticker);const q=session.round[session.index];session.locked=false;$('progress').textContent=(session.index+1)+' / '+session.round.length;$('points').textContent=session.points+' pts';$('playerLabel').textContent=player||'Convidado';$('question').textContent=q.prompt;$('answers').replaceChildren();$('feedback').textContent='';$('next').hidden=true;$('timerFill').style.width='100%';$('clock').textContent=config.seconds+' s';q.options.forEach((o,i)=>{let b=addText($('answers'),'button','','answer');addText(b,'span','ABCD'[i],'letter');addText(b,'span',o.text);b.onclick=()=>answer(i);});session.started=performance.now();ticker=setInterval(tick,50);$('question').focus();}
function tick(){if(!session||session.locked)return;const left=Math.max(0,config.seconds*1000-(performance.now()-session.started));$('clock').textContent=(left/1000).toFixed(1)+' s';$('timerFill').style.width=(left/(config.seconds*10))+'%';if(left<=0)answer(-1);}
function answer(index){if(!session||session.locked)return;const ms=Math.min(config.seconds*1000,Math.max(0,performance.now()-session.started));if(ms>=config.seconds*1000)index=-1;session.locked=true;clearInterval(ticker);const q=session.round[session.index],ok=index>=0&&q.options[index].correct,gained=ok?pointsFor(ms,config.seconds):0;session.points+=gained;session.hits+=Number(ok);session.time+=ms;session.log.push({question:q.prompt,answer:index>=0?q.options[index].text:'Tempo esgotado',correct:q.options.find(o=>o.correct).text,ok,time:ms});[...$('answers').children].forEach((b,i)=>{b.disabled=true;b.classList.toggle('right',q.options[i].correct);b.classList.toggle('wrong',i===index&&!ok);});$('clock').textContent=((config.seconds*1000-ms)/1000).toFixed(1)+' s';$('feedback').textContent=ok?'Acertou! +'+gained+' pontos':index<0?'Tempo esgotado.':'Não foi dessa vez.';$('points').textContent=session.points+' pts';$('next').textContent=session.index===session.round.length-1?'Ver resultado →':'Próxima →';$('next').hidden=false;}
function finish(){screen('result');currentResult={id:crypto.randomUUID(),game:config.gameId||'',seconds:config.seconds,name:player||'Convidado',points:session.points,hits:session.hits,time:Math.round(session.time),date:new Date().toISOString(),total:session.round.length,title:config.title};$('resultName').textContent=currentResult.name;$('finalPoints').textContent=session.points.toLocaleString('pt-BR')+' pts';$('finalStats').textContent=session.hits+' / '+session.round.length+' acertos · '+(session.time/1000).toFixed(1)+' s';let note='Partida de convidado.';if(player&&!online()){try{const r=ranks(),old=r.find(x=>x.name===player);if(!old||compare(currentResult,old)<0){localStorage.setItem(key(),JSON.stringify([...r.filter(x=>x.name!==player),currentResult]));note='Novo recorde!';}else note='Recorde anterior mantido.';}catch{note='Não foi possível salvar neste navegador. Baixe seu resultado.';}}$('storageNote').textContent=note;$('retryResult').hidden=true;if(player&&online()){queueResult(config,currentResult);submitCurrent(config,currentResult);}}
$('refreshRank').onclick=renderRank;$('retryPending').onclick=retryAll;$('retryResult').onclick=()=>{if(currentResult&&online())submitCurrent(config,currentResult);};$('count').onchange=()=>{};$('start').onclick=()=>start();$('guest').onclick=()=>start(true);$('next').onclick=()=>{if(!session?.locked)return;if(++session.index<session.round.length)showQuestion();else finish();};$('quit').onclick=()=>{if(confirm('Sair desta partida? O resultado parcial não será salvo.')){clearInterval(ticker);session=null;screen('home');renderRank();}};$('again').onclick=()=>start(player===null);$('backHome').onclick=()=>{screen('home');renderRank();};$('receipt').onclick=()=>download('resultado.txt',[config.title,currentResult.name,'Pontos: '+currentResult.points,'Acertos: '+currentResult.hits+'/'+session.round.length,'Tempo de resposta: '+(currentResult.time/1000).toFixed(1)+' s','Data: '+new Date(currentResult.date).toLocaleString('pt-BR'),(online()?(currentResult.confirmed?'Recebimento confirmado pelo ranking.':'Envio ainda não confirmado.'):'Resultado local.')].join('\n'));
document.addEventListener('keydown',e=>{if($('play').hidden||!session||session.locked||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const i='1234'.indexOf(e.key);if(i>=0){e.preventDefault();answer(i);}});
if(embedded){loadGame(embedded);}else{
$('qrGenerate').onclick=generateQR;$('qrLink').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();generateQR();}});$('qrLink').oninput=()=>{$('qrOutput').hidden=true;$('qrDownload').disabled=true;$('qrStatus').textContent='';};$('qrDownload').onclick=()=>{$('qrCanvas').toBlob(blob=>{if(!blob){$('qrStatus').textContent='Não foi possível baixar a imagem.';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qrcode.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);},'image/png');};$('downloadScript').onclick=()=>download('AppsScript.txt',JSON.parse($('appsCode').textContent));$('testConnection').onclick=async()=>{const b=$('testConnection');b.disabled=true;$('connectionStatus').textContent='Testando…';try{const c=onlineSettings();if(!c.endpoint)throw Error('Preencha o endereço e o código do jogo.');const r=await readRemote(c,{action:'ping'});if(r.version!==1)throw Error('Atualize o código do Apps Script.');$('connectionStatus').textContent='Conexão pronta. Pode gerar o jogo.';}catch(e){$('connectionStatus').textContent=e.message+' Confira a implantação e o acesso público.';}finally{b.disabled=false;}};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6){$('status').textContent='Use um TXT de até 2 MB.';return;}try{$('source').value=await f.text();validate();}catch{$('status').textContent='Não foi possível ler o arquivo.';}e.target.value='';};$('source').oninput=()=>{parsed=null;$('export').disabled=$('preview').disabled=true;$('status').textContent='Texto alterado. Confira novamente antes de gerar.';$('review').replaceChildren();};$('validate').onclick=validate;$('preview').onclick=()=>{if(validate()){try{const c=getConfig();delete c.endpoint;delete c.gameId;loadGame(c);}catch(e){$('status').textContent=e.message;}}};$('export').onclick=()=>{if(validate()){try{download('index.html',export
